spring.application.name=secure-share
server.port=8080

# H2 file database (survives restarts). Swap for PostgreSQL in production.
# AUTO_SERVER lets the app and IntelliJ's Database window open the same file without a lock error
spring.datasource.url=jdbc:h2:file:./data/secureshare;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# Web console stays off. The file DB is still openable from IntelliJ over JDBC (AUTO_SERVER above).
spring.h2.console.enabled=false
spring.jpa.open-in-view=false

# Where encrypted blobs are stored
app.storage.path=./storage

# JWT (override via env var JWT_SECRET in real use; must be >= 32 chars)
app.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me}
app.jwt.expiry-minutes=60

# multipart limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# We use JWT, not Spring's default in-memory user: stops the "generated security password" log line
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
